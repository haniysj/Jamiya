<style>

:root[data-theme="dark"]{
  --bg:#1A1411;--surface:#241B16;--surface2:#30241D;--ink:#F0E8DC;--muted:#B5A596;--line:#3F3128;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 28px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.omr{display:inline-flex;align-items:center;gap:.28em;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.omr svg{width:1.12em;height:.58em;fill:currentColor;flex:none;color:var(--rust)}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--primary);background:transparent;color:var(--primary-ink);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--primary);color:var(--on-primary)}

.btn.dangerfill{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled,.ib:disabled{opacity:.4;cursor:default}
.ib{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;padding:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.nav{flex:none;flex-wrap:nowrap}
.mark{width:46px;height:46px;border-radius:13px;background:var(--primary);display:grid;place-items:center;flex:none}
.mark svg{width:30px;height:16px;fill:var(--gold)}
.brand h1{margin:0;font-size:21px;font-weight:800;line-height:1.2;color:var(--primary-ink)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.navrow{display:flex;gap:8px}
.theme.dg{border-color:var(--rust);color:var(--rust)}
.bellbtn{width:100%;height:32px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:12px;padding:0 8px;white-space:nowrap}
.bellbtn.on{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--primary-soft);color:var(--primary-ink);white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.rust{background:var(--rust-soft);color:var(--rust)}
.stats{display:flex;flex-wrap:nowrap;gap:6px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.stat span{color:var(--muted)}.stat b{font-weight:800}
.stat{flex:1 1 0;min-width:0;white-space:nowrap}
@media(max-width:560px){.stat{flex-direction:column;align-items:flex-start;gap:1px;padding:5px 9px;font-size:12px}.stat span{font-size:11px}}
.bellbtn{height:auto;min-height:32px;justify-content:space-between;padding:3px 10px}.bellbtn .bt{display:flex;align-items:center;gap:6px}.bellbtn .bk{display:flex;flex-direction:column;align-items:center;line-height:1.1;max-width:70px}.bellbtn .bk svg{width:15px;height:15px}.bellbtn .bk small{font-size:9.5px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtg{width:34px;height:34px}.mtg svg{transition:transform .2s}.mtg[aria-expanded="true"] svg{transform:rotate(180deg)}
.demo{margin-top:10px;padding:7px 12px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;font-weight:600}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}

.ucard{padding:10px 14px 6px}
.ucard>svg{width:100%;max-width:540px;height:auto;display:block;margin:2px auto 0}
.uh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.uh h2{margin:0;font-size:15px;font-weight:800;color:var(--primary-ink);display:flex;gap:7px;align-items:center}
.uh .sp{flex:1}
.ud{cursor:pointer}
.ud:hover{fill:rgba(200,155,60,.28)}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
.pulse{animation:ring 1.9s ease-out infinite;fill:var(--gold);transform-box:fill-box;transform-origin:center}
.theme{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0}
.theme .ic{width:1.3em;height:1.3em}
.theme.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:12px;margin:10px 0 12px;overflow-x:auto}
.tab{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 12px;font-weight:700;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.tab[aria-selected=true]{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow)}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--primary);color:var(--on-primary);padding:9px 16px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:none}
.qx{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface2);color:var(--muted);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;padding:0}
.mrow.now{outline:2.5px solid var(--gold);outline-offset:-2.5px}
.ml{cursor:pointer;flex-wrap:nowrap}
.ml i{font-style:normal;background:var(--gold);color:#2A2008;border-radius:999px;font-size:10.5px;font-weight:800;padding:0 7px}
.chip{cursor:pointer}
.chip:hover{border-color:var(--primary)}
.who{display:flex;flex-direction:column;gap:8px}
.whoc{padding:10px 12px}

.pm{display:flex;flex-wrap:wrap;gap:5px}
.pm button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:2px 9px;font-size:12.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.pm button:hover{border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn,.arrow,.ib,.chip,.tab{transition:transform .08s,background .15s,border-color .15s}
.btn:active,.arrow:active,.ib:active{transform:scale(.96)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
[hidden]{display:none!important}
.pbar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 10px}
.pbar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
button.pchip{font-family:inherit;cursor:pointer}
.pchip{color:var(--ink)}
.pchip.cf{background:var(--rust-soft);color:var(--rust);border-color:var(--rust)}
.urow2{border-top:1px solid var(--line);padding:4px 0}.urow2:first-child{border-top:0}
.ib.dg{color:var(--rust);border-color:var(--rust)}
.pk{display:flex;align-items:center;gap:8px;padding:3px 0;font-weight:600;font-size:13px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.pchip .ic{width:1.05em;height:1.05em}
.pchip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pchip.wait{color:var(--muted)}
.pchip.wait .ic{color:var(--gold)}
.pill.okp{background:var(--ok-soft);color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.pill .ic{width:1.05em;height:1.05em}
.ptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptop h2{margin:0;font-size:16px;font-weight:800;color:var(--primary-ink);display:flex;align-items:center;gap:7px}
.ptop .sp{flex:1}
.pnote{margin-top:8px;font-size:12.5px;color:var(--muted)}
.ppanel{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.ppanel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ppanel select{flex:1;min-width:150px}
.pnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pnav b{flex:1;text-align:center;font-size:15px;color:var(--primary-ink)}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-of-type{border-top:0}
.prow .pn2{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow .bell{color:var(--line);display:inline-grid}
.prow .bell.on{color:var(--gold)}
.prow.ok .pn2{opacity:.75}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.search{position:relative}
.search input{width:100%;padding:11px 40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.search .ic{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:1.3em;height:1.3em}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2.5px solid var(--gold);outline-offset:1px}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch}
.tl .tvp{position:relative;overflow:hidden;border-radius:14px;min-width:0;container-type:inline-size;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.tframe{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;pointer-events:none}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.slot.cur{border:2px solid var(--gold);box-shadow:var(--shadow)}
.ttrack{position:relative;display:flex;gap:8px;width:calc((100cqw - 16px)/3*5 + 32px);transform:translateX(calc((100cqw - 16px)/3 + 8px));will-change:transform}
.tc{flex:0 0 calc((100cqw - 16px)/3);min-width:0;padding:42px 11px 10px}

.arrow{align-self:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary-ink);display:grid;place-items:center;padding:0}

.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:0}
.tcard.cur{border:2px solid var(--gold);box-shadow:var(--shadow)}
.tcard.empty{opacity:.5;text-align:center}
.tcard h3{margin:6px 0 6px;font-size:15px;font-weight:800;line-height:1.25}
.tcard h3 small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.pay{display:flex;justify-content:space-between;align-items:baseline;gap:6px 8px;flex-wrap:nowrap;padding:4px 0;border-top:1px dashed var(--line);font-size:13px}
.pay:first-of-type{border-top:0}
.pay .pn{min-width:0;font-weight:600;flex:1;line-height:1.3}.pay .omr{flex:none}
.pay.hit{background:var(--hit);border-radius:6px;padding-inline:5px}
.none{color:var(--muted);font-size:12.5px}
.tl .navrow{display:none}
.coll{width:100%;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--primary-ink);font-weight:800;font-size:15px;text-align:start}
.coll .ic{transition:transform .15s}
.coll[aria-expanded="true"] .ic.cv{transform:rotate(180deg)}
.coll .sp{flex:1}
.coll small{font-weight:600;color:var(--muted);font-size:12.5px}
.mrows{margin-top:8px;max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mrow{display:grid;grid-template-columns:128px 1fr;gap:8px;align-items:center;padding:4px 10px;min-height:34px}
.mrow.bs{border-top:2px solid var(--line)}
.mrow:first-child{border-top:0}
.b0{background:var(--b0)}.b1{background:var(--b1)}.b2{background:var(--b2)}.b3{background:var(--b3)}.b4{background:var(--b4)}
.ml{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.ml b{font-weight:800;font-size:13.5px}.ml small{color:var(--muted);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:12.5px;line-height:1.7;max-width:100%}
.chip .cn{font-weight:600;min-width:0}
.chip.hit{background:var(--hit);border-color:var(--gold)}
.tw{margin-top:8px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:800;color:var(--primary-ink)}
td.n{white-space:normal;font-weight:600}
tfoot td{font-weight:800;background:var(--surface2);border-bottom:0}
tr.hit td{background:var(--hit)}
.empty-box{text-align:center;padding:26px 14px;color:var(--muted)}
.empty-box .btn{margin-top:10px}
.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:12px}
/* admin + login */
.login{max-width:380px;margin:26px auto}
.login h2{margin:0 0 10px;font-size:18px;color:var(--primary-ink)}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.in,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const toInt=v=>{const n=Math.round(Number(v));return isFinite(n)&&n>0?n:0};
const monthsCount=s=>Math.max(1,Math.round((Number(s.years)||1)*12));
const monthPos=(s,i)=>{const t=(s.startMonth-1)+i;return{y:s.startYear+Math.floor(t/12),m:((t%12)+12)%12}};

const keyToIdx=(s,k)=>{const a=String(k).split('-').map(Number);return(a[0]-s.startYear)*12+(a[1]-s.startMonth)};

/* محاكاة: الالتزامات بالترتيب (نصف أول بالترتيب ثم نصف ثانٍ معكوس)،
   وعاء كل شهر يُوزَّع بالكامل FIFO. كل الأرقام صحيحة فلا يوجد أي تقريب. */
function simulate(order,N){
  const P=order.reduce((a,m)=>a+m.monthly,0);
  const half=m=>Math.floor(m.monthly*N/2);
  const obs=[];
  order.forEach(m=>obs.push({m,left:half(m),h:1}));
  for(let i=order.length-1;i>=0;i--){const m=order[i];obs.push({m,left:m.monthly*N-half(m),h:2})}
  const months=[];let oi=0;
  for(let k=0;k<N;k++){
    let pot=P;const pays=[];
    while(pot>0&&oi<obs.length){
      const ob=obs[oi];
      if(ob.left<=0){oi++;continue}
      const take=Math.min(pot,ob.left);
      if(ob.start===undefined)ob.start=k;
      const last=pays[pays.length-1];
      if(last&&last.id===ob.m.id)last.amount+=take;else pays.push({id:ob.m.id,name:ob.m.name,amount:take});
      pot-=take;ob.left-=take;
      if(ob.left===0)oi++;
    }
    months.push(pays);
  }
  const starts={};
  order.forEach(m=>starts[m.id]=[Infinity,Infinity]);
  obs.forEach(ob=>{if(ob.start!==undefined)starts[ob.m.id][ob.h-1]=ob.start});
  return{P,months,starts};
}
const PREF_KEYS=['start','mid','nearMid'];
function computeSchedule(data){
  const s=data.settings,N=monthsCount(s);
  const ms=data.members.map(m=>({id:m.id,name:m.name,pref:PREF_KEYS.includes(m.pref)?m.pref:'mid',monthly:toInt(m.monthly),months:Array.isArray(m.months)?m.months:[]}));
  const groups={start:[],mid:[],nearMid:[]};
  ms.forEach(m=>groups[m.pref].push(m));
  const build=()=>[].concat(groups.start,groups.mid,groups.nearMid);
  const targetsOf=m=>m.months.map(k=>keyToIdx(s,k)).filter(i=>i>=0&&i<N);
  let sim=simulate(build(),N);
  if(ms.some(m=>targetsOf(m).length)){
    const info=sim.starts;
    PREF_KEYS.forEach(g=>{
      const arr=groups[g];
      const withP=arr.filter(m=>targetsOf(m).length),without=arr.filter(m=>!targetsOf(m).length);
      if(arr.length<2||!withP.length)return;
      const slots=arr.map(m=>info[m.id]),taken=arr.map(()=>false),res=new Array(arr.length);
      withP.forEach(m=>{
        const t=targetsOf(m);let best=-1,bd=Infinity;
        slots.forEach((sl,i)=>{
          if(taken[i])return;
          const d=Math.min.apply(null,t.map(x=>Math.min(Math.abs(sl[0]-x),Math.abs(sl[1]-x))));
          if(best<0||d<bd){bd=d;best=i}
        });
        taken[best]=true;res[best]=m;
      });
      let wi=0;
      for(let i=0;i<arr.length;i++)if(!taken[i])res[i]=without[wi++];
      groups[g]=res;
    });
    sim=simulate(build(),N);
  }
  const months=sim.months.map((p,i)=>{const q=monthPos(s,i);return{i,y:q.y,m:q.m,payments:p}});
  return{N,pot:sim.P,months,total:sim.P*N};
}

function ucurve(N,cur){
  /* مسار متعرّج: يبدأ من اليمين فوق، يمضي يسارًا، ينزل، ثم يعود يمينًا. كل ٦ أشهر بلون كما في الجدول الشهري */
  const s=state.settings,R=2,xR=552,xL=48,gap=42,top=34,SW=15,rad=gap/2;
  const ti=todayIdx(),tc=clampIdx(ti),cmax=Math.ceil(N/R),w=(xR-xL)/cmax;
  const y=r=>top+r*gap;
  const geo=i=>{const r=Math.floor(i/cmax),k=i-r*cmax,even=r%2===0,xs=even?xR:xL,d=even?-1:1,xa=xs+d*k*w,xb=xa+d*w;return{r,xa,xb,cx:(xa+xb)/2,y:y(r)}};
  const band=i=>Math.floor(i/6)%5,op=i=>i<=ti?1:.5;
  let track=`M${xR} ${y(0)}`;
  for(let r=0;r<R;r++){track+=` H${r%2===0?xL:xR}`;if(r<R-1)track+=` A${rad} ${rad} 0 0 ${r%2===0?0:1} ${r%2===0?xL:xR} ${y(r+1)}`}
  let segs='',turns='',hits='';
  for(let i=0;i<N;i++){
    const g=geo(i),mp=monthPos(s,i),e=g.xb+(g.xb>g.xa?.5:-.5);
    segs+=`<line x1="${g.xa.toFixed(1)}" x2="${e.toFixed(1)}" y1="${g.y}" y2="${g.y}" stroke="var(--p${band(i)})" stroke-width="${SW}" opacity="${op(i)}"/>`;
    hits+=`<rect class="ud" data-act="goto" data-i="${i}" x="${Math.min(g.xa,g.xb).toFixed(1)}" y="${g.y-12}" width="${w.toFixed(1)}" height="24" fill="transparent"><title>${MONTHS[mp.m]} ${mp.y} — الشهر ${i+1}</title></rect>`;
  }
  for(let r=0;r<R-1;r++){
    const li=Math.min(N-1,(r+1)*cmax-1),even=r%2===0,x=even?xL:xR;
    if(N>(r+1)*cmax)turns+=`<path d="M${x} ${y(r)} A${rad} ${rad} 0 0 ${even?0:1} ${x} ${y(r+1)}" fill="none" stroke="var(--p${band(li)})" stroke-width="${SW}" opacity="${op(li)}"/>`;
  }
  const c=geo(tc),k=geo(cur),a=monthPos(s,0),b=monthPos(s,N-1),eg=geo(N-1),F='font-family="Cairo,sans-serif" font-size="15" font-weight="600" fill="var(--muted)"';
  const endX=Math.max(45,Math.min(555,eg.xb));
  return`<svg viewBox="0 0 600 ${top+(R-1)*gap+38}" role="img" aria-label="مسار الجمعية، الشهر ${tc+1} من ${N}">
  <path d="${track}" fill="none" stroke="var(--line)" stroke-width="${SW+5}" stroke-linecap="round"/>${turns}${segs}${hits}
  <text x="${xR+4}" y="14" text-anchor="middle" ${F}>${MONTHS[a.m]} ${a.y}</text>
  <text x="${endX.toFixed(1)}" y="${y(R-1)+29}" text-anchor="middle" ${F}>${MONTHS[b.m]} ${b.y}</text>
  ${cur!==tc?`<circle cx="${k.cx.toFixed(1)}" cy="${k.y}" r="11" fill="none" stroke="var(--primary-ink)" stroke-width="3" pointer-events="none"/>`:''}
  <circle class="pulse" cx="${c.cx.toFixed(1)}" cy="${c.y}" r="9" pointer-events="none"/>
  <circle cx="${c.cx.toFixed(1)}" cy="${c.y}" r="8" fill="var(--gold)" stroke="var(--surface)" stroke-width="3" pointer-events="none"/></svg>`;
}
function cellHTML(sched,i){
  if(i<0||i>=sched.N)return`<div class="tc empty"><h3>—</h3></div>`;
  const mo=sched.months[i];
  const pays=mo.payments.filter(p=>hitName(p.name));
  const body=pays.length?pays.map(p=>`<div class="pay${q?' hit':''}"><span class="pn">${esc(p.name)}</span>${money(p.amount)}</div>`).join(''):`<div class="none">${q?'لا يستلم هذا الشهر':'—'}</div>`;
  return`<div class="tc"><h3>${MONTHS[mo.m]}<small>${mo.y} · الشهر ${i+1}</small></h3>${body}</div>`;
}

  const t=todayIdx();
  $('#tlsec').innerHTML=`<div class="sec-h"><h2>${ic('cal')}الجدول الزمني</h2><span class="sp"></span>${cursor!==clampIdx(t)?`<button class="btn sm" data-act="today">العودة لهذا الشهر</button>`:''}</div>
   <div class="tl"><button class="arrow pv" data-act="prev" aria-label="الشهر السابق" ${cursor<=0?'disabled':''}>${ic('chev')}</button>
   <div class="tvp" id="tvp"><div class="tframe"><div class="slot"><span class="pill">السابق</span></div><div class="slot cur"><span class="pill${cursor===t?' gold':''}">${cursor===t?'الشهر الحالي':'الشهر المحدد'}</span></div><div class="slot"><span class="pill">القادم</span></div></div><div class="ttrack" id="ttrack">${[-2,-1,0,1,2].map(d=>cellHTML(sched,cursor+d)).join('')}</div></div>
   <button class="arrow nx" data-act="next" aria-label="الشهر التالي" ${cursor>=N-1?'disabled':''}>${ic('chev')}</button></div>`;
  $('#paysec').innerHTML=paySecHTML();
  // الجدول الشهري
  const rows=sched.months.filter(m=>!q||m.payments.some(p=>hitName(p.name)));
  const showM=openM||q;
  $('#monsec').innerHTML=`<button class="coll" data-act="tg-m" aria-expanded="${showM}">${ic('table')}الجدول الشهري الكامل<small>${q?rows.length+' شهرًا مطابقًا':N+' شهرًا'}</small><span class="sp"></span>${ic('down','cv')}</button>`+
   (showM?`<div class="mrows">${rows.length?rows.map(m=>`<div class="mrow b${Math.floor(m.i/6)%5}${m.i%6===0&&m.i?' bs':''}${m.i===ti?' now':''}"><div class="ml" data-act="goto" data-i="${m.i}" title="عرض هذا الشهر"><b>${MONTHS[m.m]}</b><small>${m.y}</small>${m.i===ti?'<i>الآن</i>':''}</div><div class="chips">${m.payments.map(p=>`<span class="chip${q&&hitName(p.name)?' hit':''}" data-act="who" data-n="${esc(p.name)}" title="عرض كل دفعات ${esc(p.name)}"><span class="cn">${esc(p.name)}</span>${money(p.amount)}</span>`).join('')}</div></div>`).join(''):'<div class="empty-box">لا توجد نتائج مطابقة.</div>'}</div>`:'');
  // جدول الإجماليات
  const mem=state.members.filter(m=>hitName(m.name));
  const showT=openT||q;
  $('#totsec').innerHTML=`<button class="coll" data-act="tg-t" aria-expanded="${showT}">${ic('users')}مستحقات الأعضاء<small>${q?mem.length+' عضوًا مطابقًا':state.members.length+' عضوًا'}</small><span class="sp"></span>${ic('down','cv')}</button>`+
   (showT?`<div class="tw"><table><thead><tr><th>الاسم</th><th>المبلغ الشهري</th><th>إجمالي المستحق</th></tr></thead><tbody>${mem.length?mem.map(m=>`<tr${q?' class="hit"':''}><td class="n">${esc(m.name)}</td><td>${money(toInt(m.monthly))}</td><td>${money(toInt(m.monthly)*N)}</td></tr>`).join(''):'<tr><td colspan="3" class="none">لا توجد نتائج مطابقة.</td></tr>'}</tbody>${q?'':`<tfoot><tr><td>المجموع</td><td>${money(sched.pot)}</td><td>${money(sched.total)}</td></tr></tfoot>`}</table></div>`:'');
  const nm=document.querySelector('.mrows');
  if(nm){if(scrollNow){const r=nm.querySelector('.mrow.now');if(r)nm.scrollTop=Math.max(0,r.getBoundingClientRect().top-nm.getBoundingClientRect().top+nm.scrollTop-6);scrollNow=false}else nm.scrollTop=oldTop}
}

function loginHTML(){
  const def=!REMOTE&&state.users.some(x=>x.u==='admin'&&x.p==='admin123');
  return`<section class="card login"><h2>${ic('lock')} دخول الإدارة</h2>
  <div class="fld"><span>اسم المستخدم</span><input class="in" id="lu" autocomplete="username" autocapitalize="off"></div>
  <div class="fld" style="margin-top:10px"><span>كلمة المرور</span><input class="in" id="lp" type="password" autocomplete="current-password"></div>
  <div class="err" id="lerr">${esc(loginErr)}</div>
  <button class="btn pri" data-act="login" style="width:100%;justify-content:center">دخول</button>
  ${def?'<p class="hint">النسخة التجريبية: المستخدم admin وكلمة المرور admin123 (غيّرها من لوحة التحكم).</p>':''}</section>`;
}
async function afterAuth(){
  if(can('users')){try{remoteUsers=await rpc('jamiya_users2',{p_u:creds.u,p_p:creds.p})||[]}catch(e){remoteUsers=[]}}
  if(can('pay')){try{pushSubs=await rpc('jamiya_push_subs',{p_u:creds.u,p_p:creds.p})||{}}catch(e){}}
}
async function restoreSession(){
  if(!REMOTE)return;
  let a=null;try{a=JSON.parse(localStorage.getItem('jamiya-auth')||'null')}catch(e){}
  if(!a||!a.u||!a.p)return;
  try{
    const me=await rpc('jamiya_me',{p_u:a.u,p_p:a.p});
    if(me){creds={u:a.u,p:a.p};user=a.u;perms=me.perms||[];await afterAuth()}
    else{try{localStorage.removeItem('jamiya-auth')}catch(e){}}
  }catch(e){}
}
async function doLogin(){
  const u=(($('#lu')||{}).value||'').trim(),p=($('#lp')||{}).value||'';
  const fail=m=>{loginErr=m;const e=$('#lerr');if(e)e.textContent=m};
  if(!REMOTE){
    const x=state.users.find(y=>y.u===u&&y.p===p);
    if(x){user=u;perms=x.perms||ALLP.slice();loginErr='';tab=firstTab();view='admin';render()}
    else fail('اسم المستخدم أو كلمة المرور غير صحيحة');
    return;
  }
  const e=$('#lerr');if(e)e.textContent='جارٍ التحقق…';
  try{
    const me=await rpc('jamiya_me',{p_u:u,p_p:p});
    if(!me){fail('اسم المستخدم أو كلمة المرور غير صحيحة');return}
    creds={u,p};user=u;perms=me.perms||[];loginErr='';
    try{localStorage.setItem('jamiya-auth',JSON.stringify({u,p}))}catch(x){}
    await afterAuth();
    tab=firstTab();view='admin';render();
  }catch(x){fail('تعذّر الاتصال بقاعدة البيانات، حاول مرة أخرى.')}
}

async function userAction(kind,arg){
  const say=m=>{const e=$('#uerr2')||$('#uerr');if(e)e.textContent=m};
  const getp=sel=>[...document.querySelectorAll(sel+' [data-pk]')].filter(c=>c.checked).map(c=>c.dataset.pk);
  const mapErr=e=>/exists/.test(e.message)?'اسم المستخدم موجود مسبقًا.':/last_admin/.test(e.message)?'يجب أن يبقى مستخدم واحد على الأقل بصلاحية إدارة المستخدمين.':/forbidden|42501/.test(e.message)?'ليس لديك صلاحية.':'تعذّر تنفيذ العملية.';
  try{
    if(kind==='add'){
      const u=($('#nu').value||'').trim(),p=$('#np').value||'',pm=getp('#addperm');
      if(!u||!p)return say('اكتب اسم المستخدم وكلمة المرور.');
      if(!REMOTE){
        if(state.users.some(x=>x.u===u))return say('اسم المستخدم موجود مسبقًا.');
        state.users.push({u,p,perms:pm});touch();
      }else{await rpc('jamiya_add_user2',{p_u:creds.u,p_p:creds.p,p_nu:u,p_np:p,p_perms:pm});toast('تمت إضافة المستخدم')}
    }else if(kind==='del'){
      if(!REMOTE){if(arg!==user&&state.users.length>1){state.users=state.users.filter(x=>x.u!==arg);touch()}}
      else{await rpc('jamiya_del_user',{p_u:creds.u,p_p:creds.p,p_du:arg});toast('تم حذف المستخدم')}
    }else if(kind==='save'){
      const orig=editU.orig,nn=($('#eu-n').value||'').trim(),np=$('#eu-p').value||'',pm=getp('#editperm');
      if(!nn)return say('اسم المستخدم مطلوب.');
      if(np&&np.length<6)return say('كلمة المرور يجب ألا تقل عن 6 أحرف.');
      if(!REMOTE){
        if(nn!==orig&&state.users.some(x=>x.u===nn))return say('اسم المستخدم موجود مسبقًا.');
        const x=state.users.find(y=>y.u===orig);
        if(x){x.u=nn;if(np)x.p=np;x.perms=pm}
        if(orig===user){user=nn;perms=pm}
        touch();
      }else{
        await rpc('jamiya_update_user',{p_u:creds.u,p_p:creds.p,p_target:orig,p_newname:nn===orig?null:nn,p_newpass:np||null,p_perms:pm});
        if(orig===creds.u){
          creds={u:nn,p:np||creds.p};user=nn;perms=pm;
          try{localStorage.setItem('jamiya-auth',JSON.stringify(creds))}catch(e){}
          editU=null;toast('تم حفظ التعديلات');
          await afterAuth();render();return;
        }
        toast('تم حفظ التعديلات');
      }
      editU=null;
    }
    if(REMOTE&&can('users'))remoteUsers=await rpc('jamiya_users2',{p_u:creds.u,p_p:creds.p})||[];
    renderUsers();
  }catch(x){say(mapErr(x))}
}

async function setPaid(id,v,idx){

  paid={...paid,[k]:prev.filter(x=>x!==id).concat(v?[id]:[])};refreshPay();
  if(!REMOTE){touch();return}
  try{await rpc('jamiya_set_paid',{p_u:creds.u,p_p:creds.p,p_month:k,p_member:id,p_paid:v})}
  catch(e){paid={...paid,[k]:prev};refreshPay();toast(/forbidden|42501/.test(e.message)?'ليس لديك صلاحية تأكيد الدفع':'تعذّر حفظ الدفع')}
}
async function payAllDo(){
  const k=monthKey(state.settings,payMonth()),prev=paid[k]||[];
  const ids=state.members.filter(m=>toInt(m.monthly)>0&&!prev.includes(m.id)).map(m=>m.id);
  if(!ids.length)return;
  paid={...paid,[k]:prev.concat(ids)};refreshPay();

  try{await rpc('jamiya_set_paid_many',{p_u:creds.u,p_p:creds.p,p_month:k,p_members:ids});toast('تم تأكيد دفع الجميع')}
  catch(e){paid={...paid,[k]:prev};refreshPay();toast('تعذّر حفظ الدفع')}

async function remind(memberId){

    const j=await r.json();if(!r.ok)throw new Error('x');

  }catch(e){toast('تعذّر إرسال التنبيه')}

const b64u=t=>{const p='='.repeat((4-t.length%4)%4),r=atob((t+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushEnable(){
  const sel=$('#pushm'),id=sel?sel.value:'';
  const say=m=>{pushMsg=m;const e=document.querySelector('.ppanel .err');if(e)e.textContent=m};
  if(!id)return say('اختر اسمك أولًا.');
  try{
    say('جارٍ التفعيل…');
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return say('لم يتم السماح بالتنبيهات. فعّلها من إعدادات المتصفح للموقع.');
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    const key=await rpc('jamiya_vapid_public');
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    const j=sub.toJSON();
    await rpc('jamiya_push_subscribe',{p_member:id,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    pushMine={m:id};try{localStorage.setItem('jamiya-push',JSON.stringify(pushMine))}catch(e){}
    pushOpen=false;pushMsg='';pushUI();toast('تم تفعيل التنبيهات');
  }catch(e){say('تعذّر التفعيل. تأكد من الاتصال وحاول مرة أخرى.')}
}
async function pushDisable(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){try{await rpc('jamiya_push_unsubscribe',{p_endpoint:sub.endpoint})}catch(e){}await sub.unsubscribe()}
  }catch(e){}
  pushMine=null;try{localStorage.removeItem('jamiya-push')}catch(e){}
  pushUI();toast('تم إيقاف التنبيهات');
}

  else if(mo<=0)draftErr='المبلغ الشهري إجباري ويجب أن يكون أكبر من صفر.';
  else{state.members.push({id:uid(),name:nm,monthly:mo,pref:draft.pref,months:draft.months.slice()});state.demo=false;draft=newDraft();draftErr='';draftPicker=false;touch();renderSummary();toast('تمت إضافة '+nm)}

function click(e){
  const b=e.target.closest('[data-act]');
  const act=b?b.dataset.act:'';
  if(confirmDel&&act!=='del'){confirmDel=null;if(view==='admin')renderMembers()}
  if(toolsConfirm&&!['demo','clear','restore'].includes(act)){toolsConfirm='';if(view==='admin')renderTools()}
  if(payAllConf&&act!=='payall'){payAllConf=false;if(view==='admin')renderPay()}
  if(chipConf&&act!=='chippay'){chipConf='';refreshPay()}
  if(!b)return;
  const id=b.dataset.id;
  switch(act){
    case'go-login':loginErr='';view='login';render();break;
    case'go-home':view='home';render();break;
    case'go-admin':view='admin';render();break;
    case'logout':user=null;creds=null;perms=[];editU=null;try{localStorage.removeItem('jamiya-auth')}catch(e){}view='home';render();break;
    case'login':doLogin();break;
    case'prev':go(-1);break;
    case'next':go(1);break;
    case'today':cursor=clampIdx(todayIdx());renderHome();break;
    case'tg-m':openM=!openM;if(openM)scrollNow=true;renderHome();break;
    case'tg-t':openT=!openT;renderHome();break;
    case'theme':applyTheme(theme==='dark'?'light':'dark');render();break;
    case'tab':tab=b.dataset.t;if(tab==='pay')refreshSubs();document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===tab));TABS.forEach(x=>{const e=$('#'+x[3]);if(e)e.hidden=x[0]!==tab});break;
    case'goto':cursor=+b.dataset.i;renderHome();try{$('#tlsec').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){}break;
    case'who':q=b.dataset.n;$('#q').value=q;renderHome();try{$('#q').scrollIntoView({behavior:'smooth',block:'center'})}catch(x){}break;
    case'clearq':q='';$('#q').value='';renderHome();$('#q').focus();break;
    case'add':addMember();break;
    case'tp':if(id==='draft')draftPicker=!draftPicker;else openPicker=openPicker===id?null:id;renderMembers();break;
    case'pm':{
      const o=b.dataset.o,k=b.dataset.k,m=o==='draft'?draft:find(o);if(!m)break;
      const i=m.months.indexOf(k);if(i>=0)m.months.splice(i,1);else m.months.push(k);
      b.classList.toggle('on',i<0);
      const n=inRange(m.months).length,c=document.querySelector(`[data-cnt="${o}"]`);if(c)c.textContent=n;
      const t=document.querySelector(`[data-tags="${o}"]`);if(t)t.innerHTML=inRange(m.months).map(x=>`<span class="pill gold">${mLabel(x)}</span>`).join('');
      if(o!=='draft'){state.demo=false;touch()}
      break}
    case'up':case'dn':{
      const i=state.members.findIndex(m=>m.id===id),j=act==='up'?i-1:i+1;
      if(i>=0&&j>=0&&j<state.members.length){const t=state.members[i];state.members[i]=state.members[j];state.members[j]=t;state.demo=false;touch();renderMembers()}
      break}
    case'del':
      if(confirmDel===id){state.members=state.members.filter(m=>m.id!==id);confirmDel=null;state.demo=false;touch();renderSummary();toast('تم حذف العضو')}
      else confirmDel=id;
      renderMembers();break;
    case'uadd':userAction('add');break;
    case'udel':userAction('del',b.dataset.u);break;
    case'uedit':{const x=listUsers().find(y=>y.u===b.dataset.u);if(x){editU={orig:x.u,name:x.u,perms:(x.perms||[]).slice()};renderUsers()}break}
    case'usave':userAction('save');break;
    case'ucancel':editU=null;renderUsers();break;
    case'tg-mem':openMem.has(id)?openMem.delete(id):openMem.add(id);renderMembers();break;
    case'tg-ml':openML=!openML;renderMembers();break;
    case'chippay':{
      const i=clampIdx(cursor),k=monthKey(state.settings,i);
      if(isPaid(k,id)){if(chipConf===id){chipConf='';setPaid(id,false,i)}else{chipConf=id;refreshPay()}}
      else{chipConf='';setPaid(id,true,i)}
      break}
    case'paynav':payIdx=clampIdx(payMonth()+(+b.dataset.d));payAllConf=false;renderPay();break;
    case'paytog':setPaid(id,true);break;
    case'payundo':setPaid(id,false);break;
    case'payall':if(payAllConf){payAllConf=false;payAllDo()}else{payAllConf=true;renderPay()}break;
    case'remind':remind(id);break;
    case'remindall':remind('');break;
    case'pushtog':pushOpen=!pushOpen;pushMsg='';pushUI();break;
    case'pushon':pushEnable();break;
    case'pushoff':pushDisable();break;
    case'showbk':toolsOpen=!toolsOpen;backupText=JSON.stringify({settings:state.settings,members:state.members},null,1);toolsMsg='';renderTools();break;
    case'cpbk':{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{toolsMsg='تم النسخ.';renderTools()},()=>{toolsMsg='حدد النص ثم انسخه يدويًا.';renderTools()})}catch(x){toolsMsg='حدد النص ثم انسخه يدويًا.';renderTools()}break}
    case'demo':
      if(toolsConfirm==='demo'){const u=state.users;state=defaultData();state.users=u;draft=newDraft();toolsConfirm='';toolsMsg='تم تحميل البيانات التجريبية.';touch();renderSettings();renderSummary();renderMembers();renderTools();updateSetInfo()}
      else{toolsConfirm='demo';renderTools()}break;
    case'clear':
      if(toolsConfirm==='clear'){state.members=[];state.demo=false;toolsConfirm='';toolsMsg='تم حذف جميع الأعضاء.';touch();renderSummary();renderMembers();renderTools()}
      else{toolsConfirm='clear';renderTools()}break;
    case'restore':
      if(toolsConfirm==='restore'){
        try{const d=JSON.parse($('#bk').value);const n=normalize({settings:d.settings,members:d.members,users:state.users});
          if(!n)throw 0;n.demo=false;n.pay=paid;state=n;draft=newDraft();toolsConfirm='';toolsMsg='تمت الاستعادة.';touch();renderSettings();renderSummary();renderMembers();renderTools();updateSetInfo()}
        catch(x){toolsConfirm='';toolsMsg='النص غير صالح، لم يتم تغيير أي شيء.';renderTools()}
      }else{toolsConfirm='restore';backupText=$('#bk')?$('#bk').value:'';renderTools()}
      break;
  }
}
function input(e){
  const t=e.target;
  if(t.id==='q'){q=t.value;renderHome();return}
  if(t.dataset.s){
    const k=t.dataset.s,s=state.settings,v=t.value;
    if(k==='name')s.name=v||'جمعية';
    else if(k==='startMonth')s.startMonth=+v;
    else if(k==='startYear'){const n=Math.round(+v);if(n<2000||n>2100)return;s.startYear=n}
    else if(k==='years'){const n=+v;if(!(n>=0.5&&n<=10))return;s.years=n}
    else if(k==='share')s.share=toInt(v);
    state.demo=false;draft.monthly=draft.monthly||s.share;
    updateSetInfo();renderSummary();renderMembers();touch();return;
  }
  if(t.dataset.d){
    const k=t.dataset.d;
    if(k==='monthly'){draft.monthly=toInt(t.value);$('#dTot').innerHTML=money(draft.monthly*monthsCount(state.settings))}
    else draft[k]=t.value;
    return;
  }
  if(t.dataset.f){
    const m=find(t.dataset.id);if(!m)return;
    if(t.dataset.f==='monthly'){m.monthly=toInt(t.value);const e=document.querySelector(`[data-tot="${m.id}"]`);if(e)e.innerHTML=money(m.monthly*monthsCount(state.settings));renderSummary()}
    else m[t.dataset.f]=t.value;
    state.demo=false;touch();
  }
}
function keydown(e){
  if(e.key!=='Enter')return;
  const t=e.target;
  if(t.id==='lu'||t.id==='lp'){e.preventDefault();doLogin()}
  else if(t.dataset.d==='name'||t.dataset.d==='monthly'){e.preventDefault();addMember()}
  else if(t.id==='nu'||t.id==='np'){e.preventDefault();click({target:document.querySelector('[data-act="uadd"]')})}
}
const app=$('#app');
app.addEventListener('click',click);
app.addEventListener('input',input);
app.addEventListener('change',input);
app.addEventListener('keydown',keydown);
/* شريط زمني: العناوين (السابق/الحالي/القادم) ثابتة والبطاقات تتحرك مع الإصبع بسلاسة، والأسهم تعمل بنفس الحركة */
let drag=null,busy=false;
const trackStep=()=>{const t=$('#ttrack');return t&&t.children[0]?t.children[0].offsetWidth+8:0};
function setTx(x,anim){const t=$('#ttrack');if(!t)return;t.style.transition=anim?'transform .24s cubic-bezier(.22,.8,.3,1)':'none';t.style.transform=`translateX(${x}px)`}
function go(dir){
  const n=cursor+dir;
  if(busy||n<0||n>=monthsCount(state.settings))return;
  const st=trackStep();
  if(!st){cursor=n;renderHome();return}
  busy=true;setTx(st+dir*st,true);
  setTimeout(()=>{cursor=n;busy=false;renderHome()},240);
}
app.addEventListener('pointerdown',e=>{
  const v=e.target.closest&&e.target.closest('.tvp');
  if(!v||busy||(e.pointerType==='mouse'&&e.button!==0)){drag=null;return}
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,t:Date.now(),on:false,dx:0,st:trackStep(),v};
});
app.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag.on=true;try{drag.v.setPointerCapture(e.pointerId)}catch(x){}}
    else return;
  }
  let d=Math.max(-drag.st,Math.min(drag.st,dx));
  const ok=d>0?cursor<monthsCount(state.settings)-1:cursor>0;
  if(!ok)d*=0.25;
  drag.dx=d;setTx(drag.st+d,false);
});
const endDrag=e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(!d.on)return;
  const vel=d.dx/Math.max(1,Date.now()-d.t),dir=d.dx>0?1:-1;
  const ok=dir>0?cursor<monthsCount(state.settings)-1:cursor>0;
  if(e.type==='pointerup'&&ok&&(Math.abs(d.dx)>d.st*0.3||Math.abs(vel)>0.45)){
    busy=true;setTx(d.st+dir*d.st,true);
    setTimeout(()=>{cursor+=dir;busy=false;renderHome()},230);
  }else setTx(d.st,true);
};
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);

(async function boot(){
  let th='light';try{th=localStorage.getItem('jamiya-theme')||'light'}catch(e){}
  applyTheme(th==='dark'?'dark':'light');
  state=normalize(await Storage.load())||defaultData();
  if(REMOTE)await Promise.all([loadPaid(),restoreSession()]);else paid=state.pay||{};
  draft=newDraft();cursor=clampIdx(todayIdx());
  render();
  if(REMOTE)document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible'||view==='login')return;
    if(user){await loadPaid();refreshPay();return}
    await loadPaid();const d=normalize(await Storage.load());if(d){state=d;if(view==='home')renderHome()}else if(view==='home')renderHome()
  });
})();
</script>
</body></html>
