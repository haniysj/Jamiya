.search .ic{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:1.3em;height:1.3em}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2.5px solid var(--gold);outline-offset:1px}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch}
.tl .tvp{position:relative;overflow:hidden;border-radius:14px;min-width:0;container-type:inline-size;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.tframe{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;pointer-events:none}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.slot.cur{border:2px solid var(--gold);box-shadow:var(--shadow)}
.ttrack{position:relative;display:flex;gap:8px;width:calc((100cqw - 16px)/3*5 + 32px);transform:translateX(calc((100cqw - 16px)/3 + 8px));will-change:transform}
.tc{flex:0 0 calc((100cqw - 16px)/3);min-width:0;padding:42px 11px 10px}
.tc.empty{opacity:.5;text-align:center}
.tc h3{margin:0 0 6px;font-size:15px;font-weight:800;line-height:1.25}
.tc h3 small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.arrow{align-self:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary-ink);display:grid;place-items:center;padding:0}
.arrow:disabled{opacity:.35;cursor:default}
.arrow.nx .ic{transform:scaleX(-1)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:0}
.tcard.cur{border:2px solid var(--gold);box-shadow:var(--shadow)}
.tcard.empty{opacity:.5;text-align:center}
.tcard h3{margin:6px 0 6px;font-size:15px;font-weight:800;line-height:1.25}
.tcard h3 small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.pay{display:flex;justify-content:space-between;align-items:baseline;gap:6px 8px;flex-wrap:nowrap;padding:4px 0;border-top:1px dashed var(--line);font-size:13px}
.pay:first-of-type{border-top:0}
.pay .pn{min-width:0;font-weight:600;flex:1;line-height:1.3}.pay .omr{flex:none}
.pay.hit{background:var(--hit);border-radius:6px;padding-inline:5px}
.none{color:var(--muted);font-size:12.5px}
.tl .navrow{display:none}
.coll{width:100%;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--primary-ink);font-weight:800;font-size:15px;text-align:start}
.coll .ic{transition:transform .15s}
.coll[aria-expanded="true"] .ic.cv{transform:rotate(180deg)}
.coll .sp{flex:1}
.coll small{font-weight:600;color:var(--muted);font-size:12.5px}
.mrows{margin-top:8px;max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mrow{display:grid;grid-template-columns:128px 1fr;gap:8px;align-items:center;padding:4px 10px;min-height:34px}
.mrow.bs{border-top:2px solid var(--line)}
.mrow:first-child{border-top:0}
.b0{background:var(--b0)}.b1{background:var(--b1)}.b2{background:var(--b2)}.b3{background:var(--b3)}.b4{background:var(--b4)}
.ml{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.ml b{font-weight:800;font-size:13.5px}.ml small{color:var(--muted);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:12.5px;line-height:1.7;max-width:100%}
.chip .cn{font-weight:600;min-width:0}
.chip.hit{background:var(--hit);border-color:var(--gold)}
.tw{margin-top:8px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:800;color:var(--primary-ink)}
td.n{white-space:normal;font-weight:600}
tfoot td{font-weight:800;background:var(--surface2);border-bottom:0}
tr.hit td{background:var(--hit)}
.empty-box{text-align:center;padding:26px 14px;color:var(--muted)}
.empty-box .btn{margin-top:10px}
.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:12px}
/* admin + login */
.login{max-width:380px;margin:26px auto}
.login h2{margin:0 0 10px;font-size:18px;color:var(--primary-ink)}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.in,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr;text-align:left}
.err{color:var(--rust);font-weight:700;font-size:13px;min-height:1.4em;margin:4px 0}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.abar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.abar h2{margin:0;font-size:18px;color:var(--primary-ink);flex:1}
.save{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.save i{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.save.dirty i{background:var(--gold)}.save.saving i{background:var(--gold);animation:pl 1s infinite}.save.error i{background:var(--rust)}
@keyframes pl{50%{opacity:.25}}
.card+.card{margin-top:12px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:800;color:var(--primary-ink);display:flex;align-items:center;gap:7px}
.mem{padding:10px;border:1px solid var(--line);border-radius:14px;margin-top:8px}.mem.z1{background:rgba(255,226,92,.26);border-color:#C89B3C}.mem.z2{background:rgba(240,140,185,.17);border-color:#8E5BC4}
.mem:first-of-type{border-top:0}
.mem-top{display:flex;align-items:center;gap:8px}
.idx{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.mem-top .name{flex:1}
.acts{display:flex;gap:5px;flex:none}
.mem-bot{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-top:8px}
.amt{width:118px}.pf{width:150px}
.tot{display:flex;flex-direction:column;gap:3px;min-width:116px}
.tot>span{font-size:12px;font-weight:700;color:var(--muted)}
.tot>b{display:flex;align-items:center;min-height:38px;padding:0 12px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);font-size:15px}
.mpick{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}
.mpick .py{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.mpick .py>b{width:44px;flex:none;padding-top:3px;color:var(--primary-ink)}
.mpick .py>div{display:flex;flex-wrap:wrap;gap:5px}
.mchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:600}
.mchip.on{background:var(--gold);border-color:var(--gold);color:#2A2008}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags.amts{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px}
.amtc{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:3px 4px 3px 12px;font-size:12.5px;font-weight:700;min-width:0}
.amtc span{white-space:nowrap}.amtc .in{width:88px;min-height:32px;height:32px;padding:2px 8px;text-align:center;border-radius:999px}
.amtot{grid-column:1/-1;font-size:12.5px;color:var(--muted);line-height:1.7}.amtot b{color:var(--gold-ink)}
.schst ul{margin:4px 0 0;padding:0 18px}
.addbox{border:1.5px solid var(--primary);border-radius:14px;padding:12px;margin-bottom:6px;background:var(--bg)}
.ulist{display:flex;flex-direction:column;gap:6px}
.urow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}.urow b{flex:1}
@media (max-width:620px){
  .tl{grid-template-columns:1fr 1fr;grid-template-areas:"c c" "p n"}
  .tl .tvp{grid-area:c}
  .tl .arrow.pv{grid-area:p;justify-self:start}.tl .arrow.nx{grid-area:n;justify-self:end}
  .slot{padding:8px 7px}.tc{padding:38px 7px 8px}.tc h3{font-size:13.5px}.pay{font-size:11.5px;gap:4px;flex-wrap:nowrap;align-items:center}.pay .omr{font-size:11.5px}
  .mrow{grid-template-columns:62px 1fr;padding:4px 8px;gap:6px}
  .ml{flex-direction:column;align-items:flex-start;gap:0;line-height:1.25}.ml b{font-size:12.5px}.ml small{font-size:11px}
  .chip{font-size:11.5px;padding:0 6px;gap:5px}.chips{gap:4px}
  .brand h1{font-size:17px}.brand p{font-size:11.5px}.mark{width:40px;height:40px}.mark svg{width:26px}
  .nav .btn{padding:8px 10px}.nav .btn .bl{display:none}
  .amt{width:calc(50% - 6px)}.pf{width:100%}
  .tot{flex:1}
}

/* ---- شاشة الافتتاح + دخول متدرّج ---- */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;background:radial-gradient(120% 90% at 50% 35%,#7A5038 0%,#5B3A29 55%,#3B2418 100%);color:#F6E9C6;text-align:center;cursor:pointer;transition:opacity .55s ease,transform .55s ease,visibility .55s;padding:24px}
#splash.out{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:14px}
.sp-ring{position:relative;width:132px;height:132px;display:grid;place-items:center;animation:spPop .8s cubic-bezier(.2,.9,.3,1.2) both}
.sp-ring>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sp-ring .rg{fill:none;stroke:#D9AF55;stroke-width:3;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transform:rotate(-90deg);transform-origin:60px 60px;animation:spDraw 1.5s .25s ease-out forwards}
.sp-ring .rb{fill:none;stroke:rgba(246,233,198,.14);stroke-width:3}
.sp-ring .orb{transform-origin:60px 60px;animation:spOrb 1.5s .25s ease-out both}
.sp-ring .orb circle{fill:#F6E9C6}
.sp-ring .mk{width:84px;height:84px;border-radius:24px;background:rgba(0,0,0,.22);display:grid;place-items:center;animation:spPulse 2.4s 1.2s ease-in-out infinite}
.sp-ring .mk svg{width:56px;height:30px;fill:#D9AF55}
#splash h1{margin:0;font-size:26px;font-weight:800;animation:spUp .7s .5s both}
#splash .sp-top{flex:1}#splash .sp-mid{flex:1;display:flex;align-items:center;justify-content:center}#splash .sp-foot{margin:0;padding-bottom:max(6px,env(safe-area-inset-bottom));font-size:13px;--o:.75;opacity:.75;animation:spUp .7s .7s both}
#splash .sp-hint{font-size:13px;--o:.6;opacity:.6;animation:spUp .7s 1.1s both}
@keyframes spPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spOrb{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spPulse{50%{transform:scale(1.07)}}
@keyframes spUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:var(--o,1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
body.enter .wrap>header,body.enter .wrap>.sec,body.enter .wrap>.card,body.enter .wrap>div,body.enter .wrap>section{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
body.enter .wrap>:nth-child(2){animation-delay:.08s}body.enter .wrap>:nth-child(3){animation-delay:.16s}body.enter .wrap>:nth-child(4){animation-delay:.24s}body.enter .wrap>:nth-child(5){animation-delay:.32s}body.enter .wrap>:nth-child(6){animation-delay:.4s}body.enter .wrap>:nth-child(7){animation-delay:.48s}body.enter .wrap>:nth-child(n+8){animation-delay:.55s}

body.enter .ucard svg line{animation:segIn .5s backwards;animation-delay:calc(.25s + var(--d)*16ms)}
body.enter .ucard svg circle,body.enter .ucard svg path:last-of-type{animation:dotIn .6s 1.2s backwards cubic-bezier(.2,.9,.3,1.4);transform-box:fill-box;transform-origin:center}
body.enter .stat,body.enter .tc,body.enter .pm button,body.enter .pill{animation:pop .55s cubic-bezier(.2,.9,.3,1.25) backwards}
body.enter .stats .stat:nth-child(2){animation-delay:.1s}body.enter .stats .stat:nth-child(3){animation-delay:.2s}
body.enter .tc:nth-child(1){animation-delay:.3s}body.enter .tc:nth-child(2){animation-delay:.38s}body.enter .tc:nth-child(3){animation-delay:.46s}body.enter .tc:nth-child(4){animation-delay:.54s}body.enter .tc:nth-child(5){animation-delay:.62s}
@keyframes segIn{from{opacity:0;stroke-width:0}}
@keyframes dotIn{from{opacity:0;transform:scale(0)}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}}
@media (hover:hover){.stat,.tc,.chip{transition:transform .18s ease,box-shadow .18s ease}.stat:hover,.tc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.chip:hover{transform:translateY(-1px)}}
.btn:active,.theme:active,.arrow:active,.ib:active{transform:scale(.94)}
.pdfb{margin-right:auto;padding:5px 8px!important;border-color:#D32F2F!important}.pdfb svg{width:22px;height:22px;display:block}.pdfb[disabled]{opacity:.5}
#printroot{display:none}
.bellrow{display:flex;gap:6px;align-items:stretch}@media(min-width:700px){.bellrow{width:max-content;max-width:100%}.bellrow .bellbtn{flex:none;padding:3px 14px}}.bellrow .bellbtn{flex:1;width:auto;min-width:0}.theme.ulk{width:36px;height:auto;min-height:32px;border-radius:10px;flex:none}.theme.ulk svg{width:18px;height:18px}.theme.ulk.on{background:var(--rust);border-color:var(--rust);color:#fff;animation:pl 1s infinite}

.gate .foot{position:static;margin-top:6px}
.stp{display:flex;align-items:center;justify-content:center;gap:6px}.stp span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--line);color:var(--muted)}.stp span.on{background:var(--primary);border-color:var(--primary);color:#fff}.stp i{width:34px;height:2px;background:var(--line)}
.devrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body.printing>*:not(#printroot){display:none!important}
  body.printing #printroot{display:block!important}
  #printroot .pg{break-after:page;page-break-after:always;margin:0}
  #printroot .pg:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

const monthPos=(s,i)=>{const t=(s.startMonth-1)+i;return{y:s.startYear+Math.floor(t/12),m:((t%12)+12)%12}};

const keyToIdx=(s,k)=>{const a=String(k).split('-').map(Number);return(a[0]-s.startYear)*12+(a[1]-s.startMonth)};

/* محاكاة: الالتزامات بالترتيب (نصف أول بالترتيب ثم نصف ثانٍ معكوس)،
   وعاء كل شهر يُوزَّع بالكامل FIFO. كل الأرقام صحيحة فلا يوجد أي تقريب. */
function simulate(order,N){
  const P=order.reduce((a,m)=>a+m.monthly,0);
  const half=m=>Math.floor(m.monthly*N/2);
  const obs=[];
  order.forEach(m=>obs.push({m,left:half(m),h:1}));
  for(let i=order.length-1;i>=0;i--){const m=order[i];obs.push({m,left:m.monthly*N-half(m),h:2})}
  const months=[];let oi=0;
  for(let k=0;k<N;k++){
    let pot=P;const pays=[];
    while(pot>0&&oi<obs.length){
      const ob=obs[oi];
      if(ob.left<=0){oi++;continue}
      const take=Math.min(pot,ob.left);
      if(ob.start===undefined)ob.start=k;
      const last=pays[pays.length-1];
      if(last&&last.id===ob.m.id)last.amount+=take;else pays.push({id:ob.m.id,name:ob.m.name,amount:take});
      pot-=take;ob.left-=take;
      if(ob.left===0)oi++;
    }
    months.push(pays);
  }
  const starts={};
  order.forEach(m=>starts[m.id]=[Infinity,Infinity]);
  obs.forEach(ob=>{if(ob.start!==undefined)starts[ob.m.id][ob.h-1]=ob.start});
  return{P,months,starts};
}
const PREF_KEYS=['start','mid','nearMid'];
function payoutsOf(d){const sc=computeSchedule(d),o={};sc.months.forEach(m=>{o[monthKey(d.settings,m.i)]=m.payments.map(p=>({id:p.id,amount:p.amount}))});return o}
function softSchedule(data){
  const s=data.settings,N=monthsCount(s);
  const ms=data.members.map(m=>({id:m.id,name:m.name,pref:PREF_KEYS.includes(m.pref)?m.pref:'mid',monthly:toInt(m.monthly),months:Array.isArray(m.months)?m.months:[]}));
  const groups={start:[],mid:[],nearMid:[]};
  ms.forEach(m=>groups[m.pref].push(m));
  const build=()=>[].concat(groups.start,groups.mid,groups.nearMid);
  const targetsOf=m=>m.months.map(k=>keyToIdx(s,k)).filter(i=>i>=0&&i<N);
  let sim=simulate(build(),N);
  if(ms.some(m=>targetsOf(m).length)){
    const info=sim.starts;
    PREF_KEYS.forEach(g=>{
      const arr=groups[g];
      const withP=arr.filter(m=>targetsOf(m).length),without=arr.filter(m=>!targetsOf(m).length);
      if(arr.length<2||!withP.length)return;
      const slots=arr.map(m=>info[m.id]),taken=arr.map(()=>false),res=new Array(arr.length);
      withP.forEach(m=>{
        const t=targetsOf(m);let best=-1,bd=Infinity;
        slots.forEach((sl,i)=>{
          if(taken[i])return;
          const d=Math.min.apply(null,t.map(x=>Math.min(Math.abs(sl[0]-x),Math.abs(sl[1]-x))));
          if(best<0||d<bd){bd=d;best=i}
        });
        taken[best]=true;res[best]=m;
      });
      let wi=0;
      for(let i=0;i<arr.length;i++)if(!taken[i])res[i]=without[wi++];
      groups[g]=res;
    });
    sim=simulate(build(),N);
  }
  const months=sim.months.map((p,i)=>{const q=monthPos(s,i);return{i,y:q.y,m:q.m,payments:p}});
  return{N,pot:sim.P,months,total:sim.P*N};
}
/* ===== الأشهر المفضلة ملزمة =====
   كل عضو لديه أشهر مفضلة يستلم فيها فقط. إذا اختار أكثر من عضو الشهر نفسه يُوزَّع الوعاء بينهم بالتناسب
   بحيث يصل كل عضو إلى إجمالي استحقاقه بالضبط (المبلغ الشهري × عدد الأشهر). الأعضاء بلا أشهر مفضلة يستلمون
   فقط في الأشهر التي لم يخترها أحد. كل المبالغ أعداد صحيحة. */
function maxFlowInt(n,edges,s,t){
  const g=Array.from({length:n},()=>[]),E=[];
  edges.forEach(([u,v,c])=>{g[u].push(E.length);E.push({v,c});g[v].push(E.length);E.push({v:u,c:0})});
  let flow=0;
  for(;;){
    const prev=new Array(n).fill(-1);prev[s]=-2;const q=[s];
    for(let h=0;h<q.length&&prev[t]===-1;h++){const u=q[h];g[u].forEach(id=>{const e=E[id];if(e.c>0&&prev[e.v]===-1){prev[e.v]=id;q.push(e.v)}})}
    if(prev[t]===-1)break;
    let f=Infinity,v=t;while(v!==s){const id=prev[v];f=Math.min(f,E[id].c);v=E[id^1].v}
    v=t;while(v!==s){const id=prev[v];E[id].c-=f;E[id^1].c+=f;v=E[id^1].v}
    flow+=f;
  }
  return{flow,E,g};
}
function mandatorySchedule(data){
  const s=data.settings,N=monthsCount(s);
  const ms=data.members.map(m=>{
    const a=m.amts&&typeof m.amts==='object'?m.amts:{};
    const months=[...new Set((Array.isArray(m.months)?m.months:[]).map(k=>keyToIdx(s,k)).filter(i=>i>=0&&i<N))].sort((x,y)=>x-y);
    const fx={};months.forEach(i=>{const v=toInt(a[monthKey(s,i)]);if(v>0)fx[i]=v});
    return{id:m.id,name:m.name,monthly:toInt(m.monthly),months,fx};
  }).filter(m=>m.monthly>0);
  const P=ms.reduce((t,m)=>t+m.monthly,0),M=ms.length;
  if(!M||!ms.some(m=>m.months.length))return null;
  const need=ms.map(m=>m.monthly*N),mname=k=>MONTHS[monthPos(s,k).m]+' '+monthPos(s,k).y,fmtN=n=>n.toLocaleString('en-US');
  const claimed=new Set();ms.forEach(m=>m.months.forEach(i=>claimed.add(i)));
  const free=[];for(let i=0;i<N;i++)if(!claimed.has(i))free.push(i);
  const fixM=new Array(N).fill(0),fixI=new Array(M).fill(0),autoM=new Array(N).fill(0);
  const autoOf=ms.map(m=>m.months.length?m.months.filter(i=>!(i in m.fx)):free);
  ms.forEach((m,i)=>Object.keys(m.fx).forEach(k=>{fixM[k]+=m.fx[k];fixI[i]+=m.fx[k]}));
  autoOf.forEach(a=>a.forEach(k=>autoM[k]++));
  const issues=[];
  ms.forEach((m,i)=>{
    if(fixI[i]>need[i])issues.push(m.name+': مجموع المبالغ المدخلة ('+fmtN(fixI[i])+') أكبر من إجمالي استحقاقه ('+fmtN(need[i])+')');
    else if(!m.months.length&&!autoOf[i].length)issues.push(m.name+': لم يختر أشهرًا ولا توجد أشهر غير محجوزة يستلم فيها');
    else if(!autoOf[i].length&&fixI[i]<need[i])issues.push(m.name+': مجموع المبالغ المدخلة ('+fmtN(fixI[i])+') أقل من إجمالي استحقاقه ('+fmtN(need[i])+')، اترك شهرًا بلا مبلغ ليكمله النظام');
  });
  for(let k=0;k<N;k++){
    if(fixM[k]>P)issues.push('شهر '+mname(k)+': مجموع المبالغ المدخلة ('+fmtN(fixM[k])+') أكبر من الوعاء ('+fmtN(P)+')');
    else if(!autoM[k]&&fixM[k]<P)issues.push(claimed.has(k)?'شهر '+mname(k)+': مجموع المبالغ المدخلة ('+fmtN(fixM[k])+') أقل من الوعاء ('+fmtN(P)+') ولا يوجد عضو بلا مبلغ ليكمله':'شهر '+mname(k)+' لم يختره أي عضو');
  }
  if(issues.length)return{issues,note:issues.join(' • ')};
  const R=fixM.map(v=>P-v),r=need.map((v,i)=>v-fixI[i]);
  let U=1;for(const u of[500,100,50,10]){if(P%u===0&&need.every(v=>v%u===0)&&ms.every(m=>Object.keys(m.fx).every(k=>m.fx[k]%u===0))){U=u;break}}
  const S=N+M,T=S+1,edges=[],cell=[];
  for(let k=0;k<N;k++)edges.push([S,k,R[k]/U]);
  autoOf.forEach((a,i)=>a.forEach(k=>{cell.push([i,k,edges.length]);edges.push([k,N+i,1e9])}));
  for(let i=0;i<M;i++)edges.push([N+i,T,r[i]/U]);
  const total=R.reduce((t,v)=>t+v,0)/U,base=maxFlowInt(T+1,edges,S,T);
  if(base.flow!==total){
    const short=ms.filter((m,i)=>autoOf[i].reduce((t,k)=>t+R[k],0)<r[i]).map(m=>m.name);
    const iss=[short.length?'لا تكفي الأشهر المتاحة لإكمال استحقاق: '+short.join('، ')+' (اختر أشهرًا أكثر أو قلّل المبالغ المدخلة)':'تعارض بين الأشهر والمبالغ المختارة: لا يمكن توزيع الوعاء بالكامل، راجع الأشهر المشتركة']; 
    return{issues:iss,note:iss.join(' • ')};
  }
  const baseX=new Map();cell.forEach(([i,k,ei])=>baseX.set(i+'_'+k,base.E[2*ei+1].c));
  const x=new Map();cell.forEach(([i,k])=>x.set(i+'_'+k,1));
  for(let it=0;it<400;it++){
    const rs=new Array(N).fill(0);cell.forEach(([i,k])=>rs[k]+=x.get(i+'_'+k));
    cell.forEach(([i,k])=>{if(rs[k]>0)x.set(i+'_'+k,x.get(i+'_'+k)*R[k]/U/rs[k])});
    const cs=new Array(M).fill(0);cell.forEach(([i,k])=>cs[i]+=x.get(i+'_'+k));
    cell.forEach(([i,k])=>{if(cs[i]>0)x.set(i+'_'+k,x.get(i+'_'+k)*r[i]/U/cs[i])});
  }
  const fl=new Map(),rowL=R.map(v=>v/U),colL=r.map(v=>v/U);
  cell.forEach(([i,k])=>{const v=Math.floor(x.get(i+'_'+k)+1e-9);fl.set(i+'_'+k,v);rowL[k]-=v;colL[i]-=v});
  let final=null;
  if(rowL.every(v=>v>=0)&&colL.every(v=>v>=0)){
    const ed=[],c2=[];
    for(let k=0;k<N;k++)if(rowL[k]>0)ed.push([S,k,rowL[k]]);
    cell.forEach(([i,k])=>{const fr=x.get(i+'_'+k)-Math.floor(x.get(i+'_'+k)+1e-9);if(fr>1e-9){c2.push([i,k,ed.length]);ed.push([k,N+i,1])}});
    for(let i=0;i<M;i++)if(colL[i]>0)ed.push([N+i,T,colL[i]]);
    const need2=rowL.reduce((t,v)=>t+v,0),rr=maxFlowInt(T+1,ed,S,T);
    if(rr.flow===need2){final=new Map(fl);c2.forEach(([i,k,ei])=>{final.set(i+'_'+k,final.get(i+'_'+k)+rr.E[2*ei+1].c)})}
  }
  if(!final)final=baseX;
  const months=[];
  for(let k=0;k<N;k++){
    const q=monthPos(s,k),pays=[];
    ms.forEach((m,i)=>{const v=(m.fx[k]||0)+(final.get(i+'_'+k)||0)*U;if(v>0)pays.push({id:m.id,name:m.name,amount:v})});
    months.push({i:k,y:q.y,m:q.m,payments:pays});
  }
  return{N,pot:P,months,total:P*N,mandatory:true,unit:U};
}
function computeSchedule(data){
  const man=mandatorySchedule(data);
  if(man&&man.mandatory)return man;
  const sc=softSchedule(data);
  if(man&&man.note){sc.note=man.note;sc.issues=man.issues}
  return sc;
}

/* ---------- الصفحة الرئيسية ---------- */
function ucurve(N,cur){
  /* مسار متعرّج: يبدأ من اليمين فوق، يمضي يسارًا، ينزل، ثم يعود يمينًا. كل ٦ أشهر بلون كما في الجدول الشهري */
  const s=state.settings,R=2,xR=552,xL=48,gap=42,top=34,SW=15,rad=gap/2;
  const ti=todayIdx(),tc=clampIdx(ti),cmax=Math.ceil(N/R),w=(xR-xL)/cmax;
  const y=r=>top+r*gap;
  const geo=i=>{const r=Math.floor(i/cmax),k=i-r*cmax,even=r%2===0,xs=even?xR:xL,d=even?-1:1,xa=xs+d*k*w,xb=xa+d*w;return{r,xa,xb,cx:(xa+xb)/2,y:y(r)}};
  const band=i=>Math.floor(i/6)%5,op=i=>i<=ti?1:.5;
  let track=`M${xR} ${y(0)}`;
  for(let r=0;r<R;r++){track+=` H${r%2===0?xL:xR}`;if(r<R-1)track+=` A${rad} ${rad} 0 0 ${r%2===0?0:1} ${r%2===0?xL:xR} ${y(r+1)}`}
  let segs='',turns='',hits='';
  for(let i=0;i<N;i++){
    const g=geo(i),mp=monthPos(s,i),e=g.xb+(g.xb>g.xa?.5:-.5);
    segs+=`<line x1="${g.xa.toFixed(1)}" x2="${e.toFixed(1)}" y1="${g.y}" y2="${g.y}" stroke="var(--p${band(i)})" stroke-width="${SW}" opacity="${op(i)}" style="--d:${i}"/>`;
    hits+=`<rect class="ud" data-act="goto" data-i="${i}" x="${Math.min(g.xa,g.xb).toFixed(1)}" y="${g.y-12}" width="${w.toFixed(1)}" height="24" fill="transparent"><title>${MONTHS[mp.m]} ${mp.y} — الشهر ${i+1}</title></rect>`;
  }
  for(let r=0;r<R-1;r++){
    const li=Math.min(N-1,(r+1)*cmax-1),even=r%2===0,x=even?xL:xR;
    if(N>(r+1)*cmax)turns+=`<path d="M${x} ${y(r)} A${rad} ${rad} 0 0 ${even?0:1} ${x} ${y(r+1)}" fill="none" stroke="var(--p${band(li)})" stroke-width="${SW}" opacity="${op(li)}"/>`;
  }
  const c=geo(tc),adx=(c.r%2===0)?-1:1,k=geo(cur),a=monthPos(s,0),b=monthPos(s,N-1),eg=geo(N-1),F='font-family="Cairo,sans-serif" font-size="15" font-weight="600" fill="var(--muted)"';
  const endX=Math.max(45,Math.min(555,eg.xb));
  return`<svg viewBox="0 0 600 ${top+(R-1)*gap+38}" role="img" aria-label="مسار الجمعية، الشهر ${tc+1} من ${N}">
  <path d="${track}" fill="none" stroke="var(--line)" stroke-width="${SW+5}" stroke-linecap="round"/>${turns}${segs}${hits}
  <text x="${xR+4}" y="14" text-anchor="middle" ${F}>${MONTHS[a.m]} ${a.y}</text>
  <text x="${endX.toFixed(1)}" y="${y(R-1)+29}" text-anchor="middle" ${F}>${MONTHS[b.m]} ${b.y}</text>

async function makePdf(btn){

    try{await Promise.all([document.fonts.load('400 14px "Readex Pro"'),document.fonts.load('700 14px "Readex Pro"'),document.fonts.load('600 14px "Readex Pro"')])}catch(e){}

    const a=monthPos(s,0),b=monthPos(s,N-1),yrs=N%12===0?(N===12?'سنة':N===24?'سنتان':`${N/12} سنوات`):`${N} شهرًا`;

    const note=(m,p)=>(notes[monthKey(s,m.i)+'|'+p.id]||'').trim();
    const mkCss=d=>`.pg{width:${W}px;height:${H}px;box-sizing:border-box;padding:${M}px;background:#fff;color:#2A1D15;font-family:'Readex Pro','Cairo',sans-serif;direction:rtl;position:relative;overflow:hidden}.pg *{box-sizing:border-box}.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #5B3A29;padding-bottom:8px}.hd h1{margin:0;font-size:21px;font-weight:700;color:#5B3A29}.hd p{margin:3px 0 0;font-size:11.5px;color:#6B5A4E}.hd .dt{text-align:left;font-size:11px;color:#6B5A4E;line-height:1.6}.sm{display:flex;gap:8px;margin:8px 0 8px}.sm div{flex:1;background:#F6F1E7;border:1px solid ${BR};border-radius:6px;padding:4px 8px;font-size:10.5px;color:#6B5A4E}.sm b{display:block;font-size:12.5px;color:#2A1D15;font-weight:600}table{width:100%;border-collapse:collapse;font-size:${d.fs}px;border:1.5px solid #3B2418}th{background:#5B3A29;color:#fff;font-weight:600;padding:${d.pad}px 6px;text-align:center;border:1px solid #3B2418}td{padding:${d.pad}px 6px;border:1px solid ${BR};vertical-align:middle;line-height:1.5}td.c{text-align:center}tr.gs td{border-top:2px solid #3B2418}.nt{color:#4A3a2e;font-size:${d.fs-1}px}.rc{display:inline-block;white-space:nowrap;margin-inline-end:10px}.rc+.rc{border-inline-start:1px solid ${BR};padding-inline-start:10px}.rc b{font-weight:600}.am{font-weight:700;color:#12683F}.ft{position:absolute;bottom:12px;left:${M}px;right:${M}px;display:flex;justify-content:space-between;font-size:10px;color:#8A7A6E;border-top:1px solid #D8CDBB;padding-top:5px}`;
    const head=`<tr><th style="width:42px">الدور</th><th style="width:48px">السنة</th><th style="width:70px">الشهر</th><th>المستلم والمبلغ</th><th style="width:190px">ملاحظات</th></tr>`;
    const gbody=gs=>{ // صفحة: عدة مجموعات ألوان (٦ أشهر لكل مجموعة)، والسنة خلية مدمجة تمتد عبر المجموعات
      const ms=[].concat(...gs),yc={},done={};ms.forEach(m=>yc[m.y]=(yc[m.y]||0)+1);
      return`<tbody>`+ms.map(m=>{
        const c=cols[Math.floor(m.i/6)%5],bg=c+'48';
        const ycell=done[m.y]?'':(done[m.y]=1,`<td class="c" rowspan="${yc[m.y]}" style="background:#F6F1E7;font-weight:700;border-top:2px solid #3B2418;border-bottom:2px solid #3B2418">${m.y}</td>`);
        const who=m.payments.map(p=>`<span class="rc"><b>${esc(p.name)}</b> <span class="am">${fmt(p.amount)} ر.ع</span></span>`).join('');
        const nts=m.payments.map(p=>({p,t:note(m,p)})).filter(x=>x.t);
        const nt=nts.length?nts.map(x=>(m.payments.length>1?`<b>${esc(x.p.name.split(' ')[0])}:</b> `:'')+esc(x.t)).join('<br>'):'—';
        return`<tr${m.i%6===0?' class="gs"':''}><td class="c" style="background:${bg};font-weight:700">${m.i+1}</td>${ycell}<td style="background:${bg};font-weight:600">${MONTHS[m.m]}</td><td style="background:${bg}">${who}</td><td class="nt" style="background:${bg}">${nt}</td></tr>`}).join('')+`</tbody>`;
    };
    const hdr=first=>`<div class="hd"><div><h1>${esc(s.name)}</h1><p>كشف تفصيلي لمسار الجمعية · ${MONTHS[a.m]} ${a.y} – ${MONTHS[b.m]} ${b.y}</p></div><div class="dt">تاريخ تنزيل الكشف<br><b>${dt}</b></div></div>`+(first?`<div class="sm"><div>المدة<b>${yrs}${N%12===0?` · ${N} شهرًا`:''}</b></div><div>الوعاء الشهري<b>${fmt(sched.pot)} ر.ع</b></div><div>عدد الأعضاء<b>${state.members.length}</b></div><div>الإجمالي<b>${fmt(sched.total)} ر.ع</b></div></div>`:'');
    const groups=[];for(let i=0;i<N;i+=6)groups.push(sched.months.slice(i,i+6));

    const fits=pg=>{pg.style.height='auto';stage.appendChild(pg);const t=pg.querySelector('table'),f=pg.querySelector('.ft');f.style.position='static';const h=pg.getBoundingClientRect().height;pg.remove();f.style.position='';pg.style.height=H+'px';return h<=H};
    const dens=[{fs:11.5,pad:5},{fs:11,pad:4},{fs:10.5,pad:3},{fs:10,pad:2}];

    await new Promise(r=>setTimeout(r,350));

}

async function userAction(kind,arg){
  const say=m=>{const e=$('#uerr2')||$('#uerr');if(e)e.textContent=m};
  const getp=sel=>[...document.querySelectorAll(sel+' [data-pk]')].filter(c=>c.checked).map(c=>c.dataset.pk);
  const mapErr=e=>/exists/.test(e.message)?'اسم المستخدم موجود مسبقًا.':/last_admin/.test(e.message)?'يجب أن يبقى مستخدم واحد على الأقل بصلاحية إدارة المستخدمين.':/forbidden|42501/.test(e.message)?'ليس لديك صلاحية.':'تعذّر تنفيذ العملية.';
  try{
    if(kind==='add'){
      const u=($('#nu').value||'').trim(),p=$('#np').value||'',pm=getp('#addperm');
      if(!u||!p)return say('اكتب اسم المستخدم وكلمة المرور.');
      if(!REMOTE){
        if(state.users.some(x=>x.u===u))return say('اسم المستخدم موجود مسبقًا.');
        state.users.push({u,p,perms:pm});touch();
      }else{await rpc('jamiya_add_user2',{p_u:creds.u,p_p:creds.p,p_nu:u,p_np:p,p_perms:pm});toast('تمت إضافة المستخدم')}
    }else if(kind==='del'){
      if(!REMOTE){if(arg!==user&&state.users.length>1){state.users=state.users.filter(x=>x.u!==arg);touch()}}
      else{await rpc('jamiya_del_user',{p_u:creds.u,p_p:creds.p,p_du:arg});toast('تم حذف المستخدم')}
    }else if(kind==='save'){
      const orig=editU.orig,nn=($('#eu-n').value||'').trim(),np=$('#eu-p').value||'',pm=getp('#editperm');
      if(!nn)return say('اسم المستخدم مطلوب.');
      if(np&&np.length<6)return say('كلمة المرور يجب ألا تقل عن 6 أحرف.');
      if(!REMOTE){
        if(nn!==orig&&state.users.some(x=>x.u===nn))return say('اسم المستخدم موجود مسبقًا.');
        const x=state.users.find(y=>y.u===orig);
        if(x){x.u=nn;if(np)x.p=np;x.perms=pm}
        if(orig===user){user=nn;perms=pm}
        touch();
      }else{
        await rpc('jamiya_update_user',{p_u:creds.u,p_p:creds.p,p_target:orig,p_newname:nn===orig?null:nn,p_newpass:np||null,p_perms:pm});
        if(orig===creds.u){
          creds={u:nn,p:np||creds.p};user=nn;perms=pm;
          try{localStorage.setItem('jamiya-auth',JSON.stringify(creds))}catch(e){}
          editU=null;toast('تم حفظ التعديلات');
          await afterAuth();render();return;
        }
        toast('تم حفظ التعديلات');
      }
      editU=null;
    }
    if(REMOTE&&can('users'))remoteUsers=await rpc('jamiya_users2',{p_u:creds.u,p_p:creds.p})||[];
    renderUsers();
  }catch(x){say(mapErr(x))}

  const web='https://wa.me/'+n;
  if(!(isIOS||/android/i.test(navigator.userAgent))){window.open(web,'_blank','noopener');return}
  let left=false;
  const t=setTimeout(()=>{if(!left&&document.visibilityState==='visible')location.href=web},1500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){left=true;clearTimeout(t)}},{once:true});
  location.href='whatsapp://send?phone='+n;
}
function click(e){
  const wa=e.target.closest&&e.target.closest('a.wa[data-wa]');
  if(wa){e.preventDefault();openWA(wa.dataset.wa);return}
  const b=e.target.closest('[data-act]');
  const act=b?b.dataset.act:'';
  if(confirmDel&&act!=='del'){confirmDel=null;if(view==='admin')renderMembers()}
  if(toolsConfirm&&!['demo','clear','restore'].includes(act)){toolsConfirm='';if(view==='admin')renderTools()}
  if(delConf&&act!=='deliv'){delConf='';refreshPay()}
  if(payAllConf&&act!=='payall'){payAllConf=false;if(view==='admin')renderPay()}
  if(chipConf&&act!=='chippay'){chipConf='';refreshPay()}
  if(!b)return;
  const id=b.dataset.id;
  switch(act){
    case'go-login':loginErr='';view='login';render();break;
    case'go-home':view='home';render();break;
    case'go-admin':view='admin';render();break;
    case'logout':user=null;creds=null;phones={};devices={};remoteUsers=[];if(!devMember)state=defaultData();notes={};noteEdit=false;delConf='';noteSel=null;perms=[];editU=null;try{localStorage.removeItem('jamiya-auth')}catch(e){}view='home';render();break;
    case'login':doLogin();break;
    case'prev':go(-1);break;
    case'next':go(1);break;
    case'today':cursor=clampIdx(todayIdx());renderHome();break;
    case'tg-m':openM=!openM;if(openM)scrollNow=true;renderHome();break;
    case'tg-t':openT=!openT;renderHome();break;
    case'theme':applyTheme(theme==='dark'?'light':'dark');render();break;
    case'tab':tab=b.dataset.t;if(tab==='pay')refreshSubs();document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===tab));TABS.forEach(x=>{const e=$('#'+x[3]);if(e)e.hidden=x[0]!==tab});break;
    case'goto':cursor=+b.dataset.i;renderHome();try{$('#tlsec').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){}break;
    case'pdf':makePdf(b);break;
    case'tg-ne':noteEdit=!noteEdit;renderHome();break;
    case'deliv':{
      const key=b.dataset.k+'|'+b.dataset.id;
      if(delConf!==key){delConf=key;refreshPay();break}
      delConf='';const want=!deliv[key],prev={...deliv};
      if(want)deliv={...deliv,[key]:true};else{deliv={...deliv};delete deliv[key]}
      refreshPay();
      rpc('jamiya_set_delivered',{p_u:creds.u,p_p:creds.p,p_month:b.dataset.k,p_member:b.dataset.id,p_done:want})
        .then(()=>toast(want?'تم تأكيد تسليم المبلغ':'تم إلغاء تأكيد التسليم'))
        .catch(e=>{deliv=prev;refreshPay();toast(/forbidden|42501/.test(e.message)?'ليس لديك صلاحية':'تعذّر حفظ التسليم')});
      break}
    case'note':noteSel=[b.dataset.k,b.dataset.id];showNote();break;
    case'note-close':noteSel=null;showNote();break;
    case'note-bg':if(e.target===b){noteSel=null;showNote()}break;
    case'note-save':saveNote(false);break;
    case'note-del':saveNote(true);break;
    case'who':q=b.dataset.n;$('#q').value=q;renderHome();try{$('#q').scrollIntoView({behavior:'smooth',block:'center'})}catch(x){}break;
    case'clearq':q='';$('#q').value='';renderHome();$('#q').focus();break;
    case'add':addMember();break;
    case'tp':if(id==='draft')draftPicker=!draftPicker;else openPicker=openPicker===id?null:id;renderMembers();break;
    case'pm':{
      const o=b.dataset.o,k=b.dataset.k,m=o==='draft'?draft:find(o);if(!m)break;
      const i=m.months.indexOf(k);if(i>=0){m.months.splice(i,1);if(m.amts)delete m.amts[k]}else m.months.push(k);
      b.classList.toggle('on',i<0);
      const n=inRange(m.months).length,c=document.querySelector(`[data-cnt="${o}"]`);if(c)c.textContent=n;
      const t=document.querySelector(`[data-tags="${o}"]`);if(t)t.innerHTML=tagsInner(m,o);
      const as=document.querySelector(`[data-asum="${o}"]`);if(as)as.textContent=asumTxt(m);
      if(o!=='draft'){state.demo=false;touch()}
      refreshStatus();
      break}
    case'up':case'dn':{
      const i=state.members.findIndex(m=>m.id===id),j=act==='up'?i-1:i+1;
      if(i>=0&&j>=0&&j<state.members.length){const t=state.members[i];state.members[i]=state.members[j];state.members[j]=t;state.demo=false;touch();renderMembers()}
      break}
    case'del':
      if(confirmDel===id){state.members=state.members.filter(m=>m.id!==id);confirmDel=null;state.demo=false;touch();renderSummary();toast('تم حذف العضو')}
      else confirmDel=id;
      renderMembers();break;
    case'uadd':userAction('add');break;
    case'udel':userAction('del',b.dataset.u);break;
    case'mesave':saveMe();break;
    case'uedit':{const x=listUsers().find(y=>y.u===b.dataset.u);if(x){editU={orig:x.u,name:x.u,perms:(x.perms||[]).slice()};renderUsers()}break}
    case'usave':userAction('save');break;
    case'ucancel':editU=null;renderUsers();break;
    case'tg-mem':openMem.has(id)?openMem.delete(id):openMem.add(id);renderMembers();break;
    case'install':installApp();break;
    case'ntsend':ntSend();break;
    case'gate-go':gateGo();break;
    case'unlink':unlinkDevice();break;
    case'devrel':devRelease(b.dataset.id);break;
    case'onb-go':onbGo();break;
    case'onb-push':onbPush();break;
    case'onb-skip':onbClose();break;
    case'onb-next':onbStep=2;onbIos=false;{const o=$('.onb');if(o)o.outerHTML=onbHTML()}break;
    case'tg-ml':openML=!openML;renderMembers();break;
    case'chippay':{
      const i=clampIdx(cursor),k=monthKey(state.settings,i);
      if(isPaid(k,id)){if(chipConf===id){chipConf='';setPaid(id,false,i)}else{chipConf=id;refreshPay()}}
      else{chipConf='';setPaid(id,true,i)}
      break}
    case'paytoday':payIdx=null;payAllConf=false;renderPay();break;
    case'paynav':payIdx=clampIdx(payMonth()+(+b.dataset.d));payAllConf=false;renderPay();break;
    case'paytog':setPaid(id,true);break;
    case'payundo':setPaid(id,false);break;
    case'payall':if(payAllConf){payAllConf=false;payAllDo()}else{payAllConf=true;renderPay()}break;
    case'remind':remind(id);break;
    case'remindall':remind('');break;
    case'pushtog':pushOpen=!pushOpen;pushMsg='';pushUI();break;
    case'pushon':pushEnable();break;
    case'pushoff':pushDisable();break;
    case'dlbk':downloadBackup();break;
    case'ldbk':pickBackupFile();break;
    case'showbk':toolsOpen=!toolsOpen;backupText=backupJSON();toolsMsg='';renderTools();break;
    case'cpbk':{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{toolsMsg='تم النسخ.';renderTools()},()=>{toolsMsg='حدد النص ثم انسخه يدويًا.';renderTools()})}catch(x){toolsMsg='حدد النص ثم انسخه يدويًا.';renderTools()}break}
    case'demo':
      if(toolsConfirm==='demo'){const u=state.users;state=defaultData();state.users=u;draft=newDraft();toolsConfirm='';toolsMsg='تم تحميل البيانات التجريبية.';touch();renderSettings();renderSummary();renderMembers();renderTools();updateSetInfo()}
      else{toolsConfirm='demo';renderTools()}break;
    case'clear':
      if(toolsConfirm==='clear'){state.members=[];state.demo=false;toolsConfirm='';toolsMsg='تم حذف جميع الأعضاء.';touch();renderSummary();renderMembers();renderTools()}
      else{toolsConfirm='clear';renderTools()}break;
    case'restore':
      if(toolsConfirm==='restore'){
        try{const d=JSON.parse($('#bk')?$('#bk').value:backupText);const n=normalize({settings:d.settings,members:d.members,users:state.users});
          if(!n)throw 0;n.demo=false;n.pay=paid;state=n;draft=newDraft();toolsConfirm='';toolsMsg='تمت الاستعادة.';
          if(REMOTE&&creds&&can('members')&&d.notes&&typeof d.notes==='object'){notes=d.notes;rpc('jamiya_notes_replace',{p_u:creds.u,p_p:creds.p,p_notes:d.notes}).catch(()=>{})}
          touch();renderSettings();renderSummary();renderMembers();renderTools();updateSetInfo()}
        catch(x){toolsConfirm='';toolsMsg='النص غير صالح، لم يتم تغيير أي شيء.';renderTools()}
      }else{toolsConfirm='restore';backupText=$('#bk')?$('#bk').value:'';renderTools()}
      break;
  }
}
function input(e){
  const t=e.target;
  if(t.dataset.nc){const[k,f]=t.dataset.nc.split('.');const c=notifCfg[k];if(!c)return;
    if(f==='on'){c.on=t.checked;const r=t.closest('.nrow');if(r)r.classList.toggle('off',!c.on)}else c[f]=+t.value;saveNotif();return}
  if(t.dataset.nm){const k=t.dataset.nm;ntD[k]=t.value;ntConf=false;
    if(k==='text'){const x=$('#ntcnt');if(x)x.textContent=t.value.length+' / 300'}
    if(k==='aud'&&e.type==='change')renderNotif();return}
  if(t.dataset.ns){const i=ntD.sel.indexOf(t.dataset.ns);if(t.checked&&i<0)ntD.sel.push(t.dataset.ns);if(!t.checked&&i>=0)ntD.sel.splice(i,1);ntConf=false;return}
  if(t.dataset.ma){
    const[o,k]=t.dataset.ma.split('|'),m=o==='draft'?draft:find(o);if(!m)return;
    m.amts=m.amts||{};const v=toInt(t.value);if(v>0)m.amts[k]=v;else delete m.amts[k];
    const x=document.querySelector(`[data-amtot="${o}"]`);if(x)x.innerHTML=amtTxt(m);
    const as=document.querySelector(`[data-asum="${o}"]`);if(as)as.textContent=asumTxt(m);
    if(o!=='draft'){state.demo=false;touch()}
    refreshStatus();return}
  if(t.dataset.ph){if(e.type==='change')setPhone(t.dataset.ph,t.value.trim());return}
  if(t.id==='q'){q=t.value;renderHome();return}
  if(t.dataset.s){
    const k=t.dataset.s,s=state.settings,v=t.value;
    if(k==='name')s.name=v||'جمعية';
    else if(k==='startMonth')s.startMonth=+v;
    else if(k==='startYear'){const n=Math.round(+v);if(n<2000||n>2100)return;s.startYear=n}
    else if(k==='years'){const n=+v;if(!(n>=0.5&&n<=10))return;s.years=n}
    else if(k==='share')s.share=toInt(v);
    state.demo=false;draft.monthly=draft.monthly||s.share;
    updateSetInfo();renderSummary();renderMembers();touch();return;
  }
  if(t.dataset.d){
    const k=t.dataset.d;
    if(k==='monthly'){draft.monthly=toInt(t.value);$('#dTot').innerHTML=money(draft.monthly*monthsCount(state.settings))}
    else draft[k]=t.value;
    return;
  }
  if(t.dataset.f){
    const m=find(t.dataset.id);if(!m)return;
    if(t.dataset.f==='monthly'){m.monthly=toInt(t.value);const e=document.querySelector(`[data-tot="${m.id}"]`);if(e)e.innerHTML=money(m.monthly*monthsCount(state.settings));renderSummary();refreshStatus()}
    else m[t.dataset.f]=t.value;
    state.demo=false;touch();
  }
}
function keydown(e){
  if(e.key!=='Enter')return;
  const t=e.target;
  if(t.id==='lu'||t.id==='lp'){e.preventDefault();doLogin()}
  else if(t.dataset.d==='name'||t.dataset.d==='monthly'){e.preventDefault();addMember()}
  else if(t.id==='onbp'){e.preventDefault();onbGo()}
  else if(t.id==='nu'||t.id==='np'){e.preventDefault();click({target:document.querySelector('[data-act="uadd"]')})}
}
const app=$('#app');
app.addEventListener('click',click);
app.addEventListener('input',input);
app.addEventListener('change',input);
app.addEventListener('keydown',keydown);
/* شريط زمني: العناوين (السابق/الحالي/القادم) ثابتة والبطاقات تتحرك مع الإصبع بسلاسة، والأسهم تعمل بنفس الحركة */
let drag=null,busy=false;
const trackStep=()=>{const t=$('#ttrack');return t&&t.children[0]?t.children[0].offsetWidth+8:0};
function setTx(x,anim){const t=$('#ttrack');if(!t)return;t.style.transition=anim?'transform .24s cubic-bezier(.22,.8,.3,1)':'none';t.style.transform=`translateX(${x}px)`}
function go(dir){
  const n=cursor+dir;
  if(busy||n<0||n>=monthsCount(state.settings))return;
  const st=trackStep();
  if(!st){cursor=n;renderHome();return}
  busy=true;setTx(st+dir*st,true);
  setTimeout(()=>{cursor=n;busy=false;renderHome()},240);
}
app.addEventListener('pointerdown',e=>{
  const v=e.target.closest&&e.target.closest('.tvp');
  if(!v||busy||(e.pointerType==='mouse'&&e.button!==0)){drag=null;return}
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,t:Date.now(),on:false,dx:0,st:trackStep(),v};
});
app.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag.on=true;try{drag.v.setPointerCapture(e.pointerId)}catch(x){}}
    else return;
  }
  let d=Math.max(-drag.st,Math.min(drag.st,dx));
  const ok=d>0?cursor<monthsCount(state.settings)-1:cursor>0;
  if(!ok)d*=0.25;
  drag.dx=d;setTx(drag.st+d,false);
});
const endDrag=e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(!d.on)return;
  const vel=d.dx/Math.max(1,Date.now()-d.t),dir=d.dx>0?1:-1;
  const ok=dir>0?cursor<monthsCount(state.settings)-1:cursor>0;
  if(e.type==='pointerup'&&ok&&(Math.abs(d.dx)>d.st*0.3||Math.abs(vel)>0.45)){
    busy=true;setTx(d.st+dir*d.st,true);
    setTimeout(()=>{cursor+=dir;busy=false;renderHome()},230);
  }else setTx(d.st,true);
};
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);

const splashT0=Date.now();let splashDone=false;
function endSplash(force){
  if(splashDone)return;const sp=document.getElementById('splash');if(!sp){splashDone=true;return}
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  const wait=force||rm?0:Math.max(0,3000-(Date.now()-splashT0));
  setTimeout(()=>{if(splashDone)return;splashDone=true;sp.classList.add('out');if(!rm){document.body.classList.add('enter');setTimeout(()=>document.body.classList.remove('enter'),1400)}setTimeout(()=>sp.remove(),700)},wait);
}
(function(){const sp=document.getElementById('splash');if(sp)sp.addEventListener('click',()=>{if(window.__ready)endSplash(true)});setTimeout(()=>{window.__ready=true;endSplash(true)},8000)})();
(async function boot(){
  let th='light';try{th=localStorage.getItem('jamiya-theme')||'light'}catch(e){}
  applyTheme(th==='dark'?'dark':'light');
  state=defaultData();
  if(REMOTE)await restoreSession();
  const raw=await Storage.load();
  if(REMOTE){if(raw||user){try{devMember=await rpc('jamiya_device_check',{p_token:devTok})||null}catch(e){}}else devMember=null}
  state=normalize(raw)||defaultData();
  if(REMOTE){if(!gated())await Promise.all([loadPaid(),loadDeliv()])}else paid=state.pay||{};
  draft=newDraft();cursor=clampIdx(todayIdx());
  try{onbM=devMember;onb=REMOTE&&!user&&!!devMember&&!!find(devMember)&&!pushMine&&!localStorage.getItem('jamiya-onb')}catch(e){}
  render();
  window.__ready=true;endSplash();
  loadMyNotes();
  if(REMOTE)document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible'||view==='login'||gated())return;
    if(user){await loadPaid();await loadDeliv();refreshPay();return}
    const raw=await Storage.load();
    if(!raw){if(!loadFailed&&devMember)releaseLocal();return}
    await loadPaid();await loadDeliv();const d=normalize(raw);if(d){state=d;if(view==='home')renderHome()}
  });
})();
